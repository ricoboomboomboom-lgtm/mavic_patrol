# mavic_manual.cfg
# Loaded from the Webots project at controllers/mavic_manual/mavic_manual.cfg.
# Lines starting with # are comments. Unknown keys are ignored.
#
# Axis indices are intentionally unmapped (-1). The RadioMaster TX12 MKII
# axis order depends on the EdgeTX/OpenTX USB joystick map and is not assumed.
# Run worlds/mavic_manual.wbt, read the [DIAG] console lines, then fill these in.
# Leave diagnostic_mode at 1 until the four axes and the arm/takeoff controls
# are filled in. diagnostic_mode = 1 never starts the propellers.

# --- Joystick map. -1 = not assigned. ---
roll_axis = 5
pitch_axis = 4
yaw_axis = 2
throttle_axis = 3

# 1 flips the normalized axis after calibration.
roll_invert = 0
pitch_invert = 0
yaw_invert = 0
throttle_invert = 0

# Raw Webots joystick counts. Defaults match the API range (-32768..32767).
# Replace neutral with the raw value printed while the stick is where you
# want the command to be zero. The throttle stick does not spring to center,
# so throttle_neutral MUST be the raw value at your chosen hover detent.
roll_min = -32768
roll_max = 32767
roll_neutral = 0
pitch_min = -32768
pitch_max = 32767
pitch_neutral = 0
yaw_min = -32768
yaw_max = 32767
yaw_neutral = 0
throttle_min = -32768
throttle_max = 32767
throttle_neutral = 0

# Deadzone is a fraction of the normalized stick after calibration.
roll_deadzone = 0.08
pitch_deadzone = 0.08
yaw_deadzone = 0.10
throttle_deadzone = 0.12

# 0 = linear, 1 = cubic. Throttle stays linear.
roll_expo = 0.35
pitch_expo = 0.35
yaw_expo = 0.30
throttle_expo = 0.0

stick_filter_tau = 0.05
throttle_filter_tau = 0.08

# Buttons and hat directions are not guessed. -1 disables that input.
# Button ids are the numbers printed next to "buttons:" in diagnostic mode.
# POV values are the integers returned by Webots (typically -1 when released).
arm_button = 0
takeoff_button = 1
disarm_button = -1
arm_pov = -1
arm_pov_value = -1
takeoff_pov = -1
takeoff_pov_value = -1
disarm_pov = -1
disarm_pov_value = -1

# Sticks are zeroed as soon as the link looks bad. Failsafe starts after this
# many seconds so a one-frame dropout does not force a landing.
usb_timeout_s = 0.20
handover_valid_s = 0.40

# --- Envelope. Roll, pitch, and horizontal speed are the required limits. ---
max_roll_deg = 25
max_pitch_deg = 25
max_horizontal_speed = 5
speed_blend_band = 0.40

# Vertical speeds are STARTING GUESSES. They are not measured Mavic limits.
# Tune them in simulation before treating them as final.
max_ascent_speed = 1.0
max_descent_speed = 0.60
failsafe_descent_speed = 0.35
takeoff_climb_speed = 0.50
takeoff_height = 1.0

max_yaw_rate_deg = 60
tilt_slew_deg_s = 45
vz_slew = 1.2
yaw_rate_slew_deg = 135
brake_speed_enter_hold = 0.12
brake_hold_time = 0.25
landing_enter_height = 0.45
landing_soft_height = 0.35
liftoff_clearance = 0.18

# Contact points at or below this world Z count as the floor (arena floor is Z = 0).
ground_contact_z = 0.08
ground_contact_time = 0.30
contact_vz_max = 0.35

arm_max_tilt_deg = 12
arming_time = 0.40
armed_timeout = 10
diagnostic_mode = 0
telemetry_period = 1.0
diagnostic_period = 0.25

# hover_thrust is the collective from the Webots R2025a mavic2pro.c sample
# for this proto (rad/s). It was not re-identified in this session.
# motor_command_limit is a conservative cap. The proto allows 576 rad/s.
hover_thrust = 68.5
idle_thrust = 20
motor_command_limit = 160
collective_slew = 50
degraded_thrust = 64

# Attitude cascade. Effective angle stiffness is angle_kp * rate_kp.
# rate_kp is the damping. It was raised from 1 after a yaw-plus-brake flip:
# the old damping could not reject the roll coupling when a turn was released.
roll_angle_kp = 8
roll_rate_kp = 6
roll_trim_ki = 1.5
roll_trim_i_limit = 0.35
roll_output_limit = 25
pitch_angle_kp = 5
pitch_rate_kp = 6
pitch_trim_ki = 1.0
pitch_trim_i_limit = 0.35
pitch_output_limit = 20
yaw_angle_kp = 4.0
yaw_rate_kp = 0.8
yaw_trim_ki = 0.15
yaw_trim_i_limit = 0.25
yaw_output_limit = 1.6
yaw_hold_rate = 0.08
yaw_lock_time = 0.15

# vel_to_tilt is rad of tilt per m/s of horizontal velocity error. TUNE.
vel_to_tilt = 0.08
vel_tilt_i = 0.02
vel_tilt_i_limit = 0.08
pos_kp = 0.55
pos_ki = 0.08
pos_i_limit = 0.40

# Altitude. vz_kp is rad/s of collective per m/s of vertical-speed error.
# The sample vertical P was 3 per metre and D was 4 per m/s. TUNE.
alt_kp = 1.0
vz_kp = 4.0
vz_ki = 1.2
vz_i_limit = 2.5
vz_output_limit = 25

expected_timestep_ms = 8
